<div class="row full-height">
  <div class="col-lg-6 logo">
    <img src="assets/images/logo.png" alt="benevolence logo" class="img-fluid"/>
  </div>
  <div class="col-lg-6">
    <div class="row h-100 justify-content-center">
      <div class="my-auto m-3 text-center">
        <div class="alert alert-info">
          Please click login to sign in with your username and password or continue as guest
        </div>
        <button (click)="auth.loginWithRedirect()" class="btn btn-primary btn-lg mb-1 mt-5">Login</button>
        <a routerLink="/public/guest" class="btn btn-primary btn-lg mt-3 mb-3">Continue as guest</a>
      </div>
    </div>
  </div>
</div>
