<main>
  <div class="row mt-5">
    <div class="col-8 ml-5">
      <h1>My Contributions</h1>
    </div>
  </div>
  <div class="row" *ngIf="!memberContributions || !memberContributions?.length">
    <div class="col-8 ml-5">
      <app-alert-panel
        [config]="{title:'INFO:You have made no contributions yet.', showMessage: false,
            contentTitle: 'Info: ' }">
        You contributions will appear here.
      </app-alert-panel>
    </div>
  </div>
  <div class="row" *ngIf="memberContributions && memberContributions?.length">
    <div class="col-8 ml-5">
      <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8 mt-5">

        <!-- Position Column -->
        <ng-container matColumnDef="amount">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Amount ($)</th>
          <td mat-cell *matCellDef="let element"> {{element.amount | currency}} </td>
        </ng-container>

        <!-- Name Column -->
        <ng-container matColumnDef="transactionId">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Transaction Id</th>
          <td mat-cell *matCellDef="let element"> {{element.transactionId}} </td>
        </ng-container>

        <ng-container matColumnDef="txDescription">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Description</th>
          <td mat-cell *matCellDef="let element"> {{element.txDescription}} </td>
        </ng-container>

        <ng-container matColumnDef="occurrence">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Occurrence #</th>
          <td mat-cell *matCellDef="let element"> {{element.occurrence}} </td>
        </ng-container>

        <!-- Weight Column -->
        <ng-container matColumnDef="createdDate">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Transaction Date</th>
          <td mat-cell *matCellDef="let element"> {{element.createdDate | date:'M/d/yy, h:mm a'}} </td>
        </ng-container>


        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
      <mat-paginator [pageSizeOptions]="[5, 10]" showFirstLastButtons></mat-paginator>
    </div>
  </div>
</main>
