<main>
  <div class="row mt-5">
    <div class="col-8 ml-5">
      <h1>My Payment Profiles</h1>
    </div>
  </div>
  <div class="row" *ngIf="!customerProfile?.paymentProfiles?.length">
    <div class="col m-3">
      <div class="alert alert-warning" role="alert">
        <mat-icon aria-label="Attention">error_outline</mat-icon>
        You do not have any payment profiles.
      </div>
    </div>
  </div>
  <div class="row" *ngIf="customerProfile?.paymentProfiles?.length">
    <div class="col-8 ml-5">
      <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8 mt-5">

        <ng-container matColumnDef="customerPaymentProfileId">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Profile Id</th>
          <td mat-cell *matCellDef="let element"> {{element.customerPaymentProfileId}} </td>
        </ng-container>

        <!-- Position Column -->
        <ng-container matColumnDef="cardNumber">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Card Number</th>
          <td mat-cell *matCellDef="let element"> {{element.cardNumber}} </td>
        </ng-container>

        <!-- Name Column -->
        <ng-container matColumnDef="expirationDate">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Expiration Date</th>
          <td mat-cell *matCellDef="let element"> {{element.expirationDate}} </td>
        </ng-container>

        <!-- Weight Column -->
        <ng-container matColumnDef="cardType">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Card Type</th>
          <td mat-cell *matCellDef="let element"> {{element.cardType}} </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef mat-sort-header></th>
          <td mat-cell *matCellDef="let element"> <mat-icon class="cursor-pointer" (click)="edit(element)">mode_edit</mat-icon> </td>
        </ng-container>


        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
      <mat-paginator [pageSizeOptions]="[5, 10]" showFirstLastButtons></mat-paginator>
    </div>
  </div>
</main>
